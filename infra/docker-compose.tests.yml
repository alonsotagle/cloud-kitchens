version: "3.3"
services:

  mongodb_test:
    image: mongo:4.0.8
    container_name: mongodb_test
    command: mongod --auth
    volumes:
      - ../db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_DATABASE=cloudkitchensdb
    networks:
      default:
        aliases:
          - db.cloudkitchens.com

  tests:
    build:
      context: ..
      dockerfile: ./infra/python.Dockerfile
      args:
        DIR_SOURCE: tests/
    container_name: tests
    command: py.test --showlocals --color=yes tests/
    environment:
      - MONGODB_DATABASE=cloudkitchensdb
      - MONGODB_USERNAME=test
      - MONGODB_PASSWORD=0X78Y!GQ#pjV%Rxz
      - MONGODB_HOSTNAME=db.cloudkitchens.com
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
    depends_on:
      - mongodb_test
